server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://melissa-playground.nararia03.dev,https://dev.melissa7.shop}

spring:
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
  ai:
    model:
      chat: openai
      image: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-mini
          temperature: 1
      image:
        options:
          model: dall-e-3
          size: 1024x1024
          style: vivid
          quality: standard
  datasource:
    url: jdbc:mysql://${AWS_DB_URL}:3306/melissa_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true #jdbc:mysql://127.0.0.1:3306/melissa_db #
    username: ${AWS_DB_USERNAME} #root #
    password: ${AWS_DB_PASSWORD} #12341234 #
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20 # 풀 크기 늘리기
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false # 요청 전/후로 EntityManager를 물고 있지 않도록
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: false
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

cloud:
  aws:
    s3:
      bucket: melissa-s3
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      default-image-key: default.png
    path:
      day-summary: day-summary
      month-summary: month-summary
      ai-profile: ai-profile
      diary: diary
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_ACCESS_KEY_ID}
      secretKey: ${AWS_SECRET_ACCESS_KEY}

security:
  jwt:
    secret-key: ${MELISSA_JWT_SECRET_KEY}
    refresh-token-pepper: ${MELISSA_REFRESH_TOKEN_PEPPER}
  encrypt:
    secret-key: ${ENC_SECRET_KEY}

idempotency:
  ttl-hours: 24
  cleanup-cron: "0 0 * * * *"

melissa:
  sqs:
    enabled: ${MELISSA_SQS_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    job-queue-url: ${AWS_SQS_JOB_QUEUE_URL:}
    max-messages-per-poll: ${MELISSA_SQS_MAX_MESSAGES_PER_POLL:5}
    wait-time-seconds: ${MELISSA_SQS_WAIT_TIME_SECONDS:20}
    visibility-timeout-seconds: ${MELISSA_SQS_VISIBILITY_TIMEOUT_SECONDS:600}
    max-receive-count: ${MELISSA_SQS_MAX_RECEIVE_COUNT:5}
    outbox-publish-batch-size: ${MELISSA_SQS_OUTBOX_PUBLISH_BATCH_SIZE:10}
    outbox-publisher-fixed-delay-ms: ${MELISSA_SQS_OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
    consumer-fixed-delay-ms: ${MELISSA_SQS_CONSUMER_FIXED_DELAY_MS:1000}
